name: Security and Quality

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security-quality:
    name: Python quality, SAST and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            connectors/otx/requirements.txt
            requirements-dev.txt

      - name: Install security and quality tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run Ruff
        run: ruff check connectors core exporters gateway tests

      - name: Run Bandit
        run: bandit --quiet --recursive --severity-level medium connectors core exporters gateway

      - name: Audit Python dependencies
        run: |
          # pycti <= 7.260722.0 pins setuptools~=82.0.0. PYSEC-2026-3447
          # concerns source-distribution file matching on macOS APFS/HFS+;
          # this Linux-only runtime does not build source distributions.
          # Keep this exception narrow and remove it when pycti relaxes the pin.
          pip-audit --strict --requirement connectors/otx/requirements.txt \
            --ignore-vuln PYSEC-2026-3447
          pip-audit --strict --requirement requirements-dev.txt
